<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWG Logs</title>
<style>
html,body{margin:0;padding:0;background:#0d0f12;color:#cfd6dd;
  font:12px/1.35 "Segoe UI",Arial,sans-serif;-webkit-user-select:none}
#hdr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
  background:#15181d;border-bottom:1px solid #262b33;padding:3px 6px}
#hdr .t{font-weight:bold;color:#e8b64c;margin-right:4px}
button{background:#1d222a;color:#aeb6bf;border:1px solid #2b323c;border-radius:3px;
  font:11px "Segoe UI",Arial;padding:2px 7px;margin-left:3px;cursor:pointer}
#meta{color:#5f6873;font-size:10px;margin-left:auto;padding-left:6px;white-space:nowrap}
#notice{display:none;background:#5a3b00;color:#ffd76e;border-bottom:1px solid #8a5a00;
  padding:4px 6px;font-weight:bold;white-space:normal}
#rows{padding:2px 4px}
.row{position:relative;height:17px;margin:2px 0;background:#14171c;
  border-radius:2px;overflow:hidden;cursor:pointer}
.bar{position:absolute;left:0;top:0;bottom:0;opacity:.85;border-radius:2px}
.lbl{position:relative;display:-webkit-flex;display:flex;
  -webkit-justify-content:space-between;justify-content:space-between;
  padding:1px 5px;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap}
.me .lbl .n{color:#ffd76e;font-weight:bold}
.arr{display:inline-block;width:10px;color:#8b95a1;font-size:9px}
.sub{position:relative;height:14px;margin:1px 0 1px 18px;background:#111318;
  border-radius:2px;overflow:hidden;font-size:10px}
.sub .bar{opacity:.55}
.sub .lbl{padding:0 5px;color:#c3cad2}
.sep{height:1px;margin:4px 0 4px 18px;background:#2b323c}
.abil{font-size:10px;color:#8b95a1;padding:1px 10px 3px 23px}
#empty{color:#4c545e;text-align:center;padding:18px 6px}
</style></head><body>
<div id="hdr"><span class="t">SWG Logs</span>
<button id="bView">Now</button><button id="bMode">Damage</button><button id="bSrc">Players</button><button id="bClear">Clear</button>
<span id="meta"></span></div>
<div id="notice"></div>
<div id="rows"><div id="empty">waiting for data&hellip;</div></div>
<script>
var view='current', mode='dmg', open={}, data=null, src='players';
if(location.pathname.indexOf('healing')>=0)mode='heal';
else if(location.pathname.indexOf('taken')>=0)mode='taken';
var VIEWS=['current','last','overall'];
var MODES=['dmg','heal','taken'];
var MODE_LBL={dmg:'Damage',heal:'Healing',taken:'Taken'};
var VIEW_LBL={current:'Now',last:'Last',overall:'All'};
var SRCS=['players','npcs','all'];
var SRC_LBL={players:'Players',npcs:'NPCs',all:'Everyone'};
function $(id){return document.getElementById(id);}
$('bView').onclick=function(){view=VIEWS[(indexOf(VIEWS,view)+1)%3];render();};
$('bMode').onclick=function(){mode=MODES[(indexOf(MODES,mode)+1)%3];render();};
$('bSrc').onclick=function(){src=SRCS[(indexOf(SRCS,src)+1)%3];render();};
$('bClear').onclick=function(){
  // clear on the server; if the request cannot get through (page left over
  // from before a meter restart), reload the page instead
  get('/clear',function(ok,txt){if(ok){try{data=JSON.parse(txt);}catch(e){}safeRender();}
    else location.reload();});};
// One GET with every failure path covered: the in-game browser can fail a
// request synchronously, time out, or return status 0 after the meter was
// restarted; each of those must still call back so polling never dies.
function get(path,cb){var x=new XMLHttpRequest(),done=false;
  function fin(ok,txt){if(done)return;done=true;cb(ok,txt);}
  try{
    x.open('GET',path+(path.indexOf('?')<0?'?':'&')+'t='+new Date().getTime(),true);
    x.timeout=2000;
    x.onreadystatechange=function(){if(x.readyState===4){lastStatus=x.status;fin(x.status===200,x.responseText);}};
    x.onerror=function(){fin(false,'');};
    x.ontimeout=function(){fin(false,'');};
    x.send();
  }catch(e){fin(false,'');}}
var fails=0,oks=0,lastStatus='-';
function indexOf(a,v){for(var i=0;i<a.length;i++)if(a[i]===v)return i;return -1;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/"/g,'&quot;');}
function fmt(n){if(n>=1e6)return (n/1e6).toFixed(1)+'m';
  if(n>=1e4)return Math.round(n/1e3)+'k';
  if(n>=1e3)return (n/1e3).toFixed(1)+'k';return ''+Math.round(n);}
function mmss(d){d=Math.round(d);var m=Math.floor(d/60),s=d%60;
  return m+':'+(s<10?'0':'')+s;}
function color(name){var h=0;
  for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
  return 'hsl('+(h%360)+',45%,38%)';}
function safeRender(){try{render();}catch(e){$('meta').textContent='page error: '+e;}}
function poll(){
  get('/data',function(ok,txt){
    if(ok){fails=0;oks++;try{data=JSON.parse(txt);}catch(e){}safeRender();}
    else{fails++;if(fails>=4)$('meta').textContent='reconnecting\u2026';}
    // always reschedule; back off a little while the meter is unreachable
    setTimeout(poll,fails?1000:250);});}
function clock(){var d=new Date(),z=function(n){return (n<10?'0':'')+n;};
  return z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds());}
function stats(){return ' · '+clock()+' · polls '+oks+' ok / '+fails+' fail (last '+lastStatus+')';}
function statusLine(){var l=data&&data.meta&&data.meta.log;
  return '<br><span style="font-size:10px">'+(l?esc(l):'')+esc(stats())+'</span>';}
function render(){
  $('bView').textContent=VIEW_LBL[view];
  $('bMode').textContent=MODE_LBL[mode];
  $('bSrc').textContent=SRC_LBL[src];
  var rowsEl=$('rows');
  if(!data){$('meta').textContent=stats();return;}
  var nt=$('notice'),msg=data.meta&&data.meta.notice;
  nt.style.display=msg?'block':'none';if(msg)nt.textContent=msg;
  var enc=data[view], idle='';
  if(!enc&&view==='current'&&data.last){enc=data.last;idle=' idle';}
  if(!enc){rowsEl.innerHTML='<div id="empty">no data yet'+statusLine()+'</div>';
    $('meta').textContent='';return;}
  var dur=enc.dur||1;
  var fresh='';
  if(data.meta&&data.meta.stale!=null&&data.meta.stale>10)
    fresh=' ⚠'+Math.round(data.meta.stale)+'s';
  $('meta').textContent=mmss(dur)+idle+fresh+' · '+clock();
  var arr=[],n,e,v;
  for(n in enc.entities){e=enc.entities[n];
    var k=e.kind||'unknown';
    if(src==='players'&&k==='npc')continue;
    if(src==='npcs'&&k!=='npc')continue;
    v=mode==='dmg'?e.dmg:mode==='heal'?e.heal:e.taken;
    if(v>0)arr.push([n,v,e]);}
  arr.sort(function(a,b){return b[1]-a[1];});
  if(!arr.length){rowsEl.innerHTML='<div id="empty">'+MODE_LBL[mode]
    +': nothing yet'+statusLine()+'</div>';return;}
  var max=arr[0][1],total=0,i;
  for(i=0;i<arr.length;i++)total+=arr[i][1];
  var me=(data.meta&&data.meta.player)||'You';
  var h='';
  for(i=0;i<arr.length;i++){
    n=arr[i][0];v=arr[i][1];e=arr[i][2];
    var pct=Math.round(v*100/total);
    // breakdown sections: damage -> by ability; healing -> by ability, then by recipient
    var secs=[],ab,sm;
    if(mode==='dmg')secs.push(e.abil);
    else if(mode==='heal'){secs.push(e.habil);secs.push(e.htgt);}
    var sections=[];
    for(var si=0;si<secs.length;si++){var items=[];sm=secs[si]||{};
      for(ab in sm)items.push([ab,sm[ab]]);
      items.sort(function(a,b){return b[1]-a[1];});
      if(items.length)sections.push(items);}
    var canOpen=sections.length>0;
    var arrow=canOpen?'<span class="arr">'+(open[n]?'&#9660;':'&#9654;')+'</span>':'<span class="arr"></span>';
    h+='<div class="row'+(n===me?' me':'')+'" data-n="'+esc(n)+'">'
      +'<div class="bar" style="width:'+(v*100/max)+'%;background:'+color(n)+'"></div>'
      +'<div class="lbl"><span class="n">'+arrow+(i+1)+'. '+esc(n)+'</span>'
      +'<span>'+fmt(v)+' ('+fmt(v/dur)+', '+pct+'%)</span></div></div>';
    if(open[n]&&canOpen){
      for(var si2=0;si2<sections.length;si2++){
        if(si2>0)h+='<div class="sep"></div>';
        var abs=sections[si2];
        // each bar fills by its share of THIS entity's total in the current view
        for(var j=0;j<abs.length&&j<8;j++){
          var share=v>0?abs[j][1]*100/v:0;
          h+='<div class="sub"><div class="bar" style="width:'+share+'%;background:'+color(n)+'"></div>'
            +'<div class="lbl"><span>'+esc(abs[j][0])+'</span>'
            +'<span>'+fmt(abs[j][1])+' ('+Math.round(share)+'%)</span></div></div>';
        }
      }
      if(mode==='dmg')h+='<div class="abil">'+e.hits+' hits, '+e.crits+' crits, max '
        +fmt(e.max)+'</div>';
    }
  }
  rowsEl.innerHTML=h;
  var rs=rowsEl.getElementsByClassName('row');
  for(i=0;i<rs.length;i++){rs[i].onclick=function(){
    var k=this.getAttribute('data-n');open[k]=!open[k];render();};}
}
poll();
</script></body></html>
