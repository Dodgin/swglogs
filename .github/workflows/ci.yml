name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used by the release job on tag pushes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.toolchain }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.86"] # 1.86 = rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}

      - name: Build (window + console, default features)
        run: cargo build --release --locked

      - name: Build (std-only console, no default features)
        run: cargo build --release --locked --no-default-features --target-dir target-std

      - name: Self-test
        run: |
          ./target/release/swglogs.exe --selftest
          ./target-std/release/swglogs.exe --selftest

      - name: Check the exe carries the icon resource
        shell: python
        run: |
          import struct
          ico = open("assets/swglogs.ico", "rb").read()
          exe = open("target/release/swglogs.exe", "rb").read()
          n = struct.unpack("<H", ico[4:6])[0]
          found = 0
          for i in range(n):
              e = 6 + i * 16
              size, off = struct.unpack("<II", ico[e + 8:e + 16])
              found += ico[off:off + min(size, 4096)] in exe
          print(f"{found}/{n} icon images embedded")
          assert found == n, "icon resource missing from swglogs.exe"

      - name: Name the exe (swglogs-v<version>-<shorthash>.exe)
        if: matrix.toolchain == 'stable'
        id: name
        shell: bash
        run: |
          # version from Cargo.toml, a trailing ".0" patch dropped, dots -> underscores: 1.0.0 -> v1_0
          ver=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/; s/\.0$//; s/\./_/g')
          name="swglogs-v${ver}-${GITHUB_SHA::7}"
          mkdir -p dist && cp target/release/swglogs.exe "dist/${name}.exe"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "artifact: ${name}.exe"

      - name: Upload swglogs.exe
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/${{ steps.name.outputs.name }}.exe
          if-no-files-found: error

  linux-std-only:
    # The core is std-only and has non-Windows stubs for the Windows-only
    # sources; make sure that path keeps compiling.
    name: Linux (std-only console build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --no-default-features
      - name: Self-test
        run: ./target/release/swglogs --selftest

  release:
    name: Release
    needs: [windows, linux-std-only]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: swglogs-v*
          merge-multiple: true
          path: dist
      - name: Attach the exe to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/swglogs-v*.exe
          generate_release_notes: true
